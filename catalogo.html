<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | Nerds Snkrz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alike&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/catalogo.css">
</head>
<body>
 
  <!-- HEADER -->
  <header class="header">
    <a href="home.html" class="header__brand">
      <img class="header__logo" src="./imgs/NSLOGO.jpg" alt="Nerds Snkrz">
      <img class="header__icon" src="./imgs/favicon.png" alt="Icono NS">
    </a>
 
    <nav class="nav">
      <a href="home.html" class="nav__link">Inicio</a>
      <a href="catalogo.html" class="nav__link nav__link--active" aria-current="page">Catálogo</a>
    </nav>
 
    <input class="search" id="buscador" type="search" placeholder="Buscar un producto" aria-label="Buscar un producto">
 
    <button class="cart" id="btn-carrito" aria-label="Carrito">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
        <path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7H6"/>
      </svg>
      <span class="cart__count" id="cart-count" hidden>0</span>
    </button>
  </header>
 
  <!-- CATÁLOGO -->
  <main class="catalogo">
    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="vacio" id="vacio" hidden>No encontramos ese producto. Prueba con otro nombre.</p>
  </main>
 
  <!-- FOOTER -->
  <footer class="footer">
    <img src="imgs/NSLOGO.jpg" alt="Icono NS" class="footer__icon">
    <p class="footer__copyright">&copy; 2026 Nerds Snkrz. Todos los derechos reservados.</p>
  </footer>
 
  <!-- MODAL: SELECCIONAR TALLA -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <header class="modal__header">
        <img class="modal__logo" src="imgs/NSLOGO.jpg" alt="Nerds Snkrz">
        <h2 class="modal__titulo" id="modal-titulo">Seleccionar</h2>
        <button class="modal__cerrar" id="modal-cerrar" aria-label="Cerrar">
          <img src="imgs/NSLOGO.jpg" alt="Cerrar">
        </button>
      </header>
 
      <div class="modal__body">
        <div class="producto">
          <img class="producto__img" id="modal-img" src="" alt="">
          <div class="producto__info">
            <h3 class="producto__nombre" id="modal-nombre">Nombre del Calzado</h3>
            <p class="producto__desc" id="modal-desc">Breve Descripción</p>
          </div>
        </div>
 
        <p class="tallas__label" id="tallas-label">Talla MX</p>
        <div class="tallas" id="tallas" role="radiogroup" aria-labelledby="tallas-label"></div>
      </div>
 
      <button class="confirmar" id="btn-confirmar" disabled>Confirmar</button>
    </div>
  </div>

  <!-- MODAL: CARRITO DE COMPRAS -->
  <div class="overlay" id="overlay-carrito" hidden>
    <div class="modal modal--carrito" role="dialog" aria-modal="true" aria-labelledby="cart-titulo">
      <header class="modal__header">
        <img class="modal__logo" src="imgs/NSLOGO.jpg" alt="Nerds Snkrz">
        <h2 class="modal__titulo" id="cart-titulo">Tu Carrito</h2>
        <button class="modal__cerrar" id="cart-cerrar" aria-label="Cerrar carrito">
          <img src="imgs/NSLOGO.jpg" alt="Cerrar">
        </button>
      </header>

      <div class="modal__body">
        <div class="cart__items" id="cart-items">
          <!-- Se genera dinámicamente -->
        </div>
        <p class="cart__vacio-msg" id="cart-vacio-msg" hidden>Tu carrito está vacío.</p>
        
        <div class="cart__resumen">
          <span class="cart__total-label">Total productos:</span>
          <span class="cart__total-cant" id="cart-total-cant">0</span>
        </div>
      </div>

      <footer class="modal__footer">
        <button class="btn-vaciar" id="btn-vaciar">Vaciar Carrito</button>
        <button class="confirmar" id="btn-comprar" disabled>Finalizar Compra</button>
      </footer>
    </div>
  </div>
 
  <!-- FOOTER Y MODALES -->
  <script src="./js/productos (1).js"></script>
  <script src="./js/catalogo (1).js"></script>
</body>
</html>
